<!-- Motion is layered onto the original Figma paths; the logo stays fixed. -->
<style>
  #Vector_9 { animation: lower-plane 9s ease-in-out infinite; }
  #Vector_10 { animation: lower-plane 9s -1.2s ease-in-out infinite; }
  #Vector_12 { animation: upper-plane 9s -1.2s ease-in-out infinite; }
  #Vector_13 { animation: upper-plane 9s ease-in-out infinite; }
  #top-organic-shapes, #middle-organic-shapes, #lower-organic-shapes {
    transform-box: fill-box;
    transform-origin: center;
    animation: soft-drift 11s ease-in-out infinite;
  }
  #middle-organic-shapes { animation-delay: -3.5s; animation-direction: reverse; }
  #lower-organic-shapes { animation-delay: -7s; }
  path[stroke-dasharray] { animation: connector-flow 7s linear infinite; }
  g[id^="Group"] > path:last-child:not(:first-child) { animation: node-glow 6s ease-in-out infinite; }
  g[id^="Group"]:nth-child(3n) > path:last-child { animation-delay: -2s; }
  g[id^="Group"]:nth-child(3n + 1) > path:last-child { animation-delay: -4s; }
  @keyframes upper-plane {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }
  @keyframes lower-plane {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  @keyframes soft-drift {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    50% { transform: translate(2px, -3px) rotate(1deg); }
  }
  @keyframes connector-flow { to { stroke-dashoffset: -10; } }
  @keyframes node-glow { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  @media (prefers-reduced-motion: reduce) {
    svg * { animation: none !important; }
  }
</style>
